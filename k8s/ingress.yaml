apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  name: bookshelf-ingress
  namespace: bookshelf

spec:
  ingressClassName: nginx

  rules:
    - http:
        paths:

          - path: /api
            pathType: Prefix
            backend:
              service:
                name: bookshelf-api
                port:
                  number: 8080

          - path: /
            pathType: Prefix
            backend:
              service:
                name: bookshelf-web
                port:
                  number: 80