trigger:
  branches:
    include:
      - feature/aca-cicd
variables:
- group: bookshelf-web-secrets
pool:
  vmImage: ubuntu-latest
stages:
- stage: Build
  displayName: Build and Push Image

  jobs: 
  - job: Build

    steps:

      - task: Docker@2
        displayName: Build and Push Web Image
        inputs:
          command: buildAndPush
          repository: bookshelf-web
          dockerfile: 'Dockerfile'
          containerRegistry: 'vn-sc-acr-bookshelf'
          arguments: |
            --build-arg VITE_API_BASE_URL=$(VITE_API_BASE_URL)
            
          tags: |
            latest
            $(Build.BuildID)

- stage: Deploy 
  displayName: Deploy to ACA 
  dependsOn: Build 

  jobs:
  - job: Deploy 

    steps:
      - task: AzureCLI@2
        displayName: Deplo Web ACA 

        inputs: 
          azureSubscription: 'Book-App-Connection'
          scriptType: pscore

          scriptLocation: inlineScript

          inlineScript: |
            az containerapp update `
            --name bookshelf-web-app `
            --resource-group rg-bookshelf-aca-dev `
            --image bookshelfacr2026.azurecr.io/bookshelf-web: $(Build.BuildID)
